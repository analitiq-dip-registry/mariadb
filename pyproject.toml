[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "analitiq-connector-mariadb"
version = "0.0.1"
description = "Analitiq connector for MariaDB: dialect, driver, definition."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["analitiq_connector_mariadb"]
package-dir = { "analitiq_connector_mariadb" = "." }

[project.entry-points."analitiq.source_connectors"]
mariadb = "analitiq_connector_mariadb.connector:MariaDBConnector"

[project.entry-points."analitiq.destination_connectors"]
mariadb = "analitiq_connector_mariadb.connector:MariaDBConnector"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
